<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KAS REGU 3 — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.matrix th:first-child, table.matrix td:first-child {
    position: sticky; left: 0; z-index: 2;
  }
  table.matrix thead th:first-child { z-index: 3; }
  /* solid backdrop so scrolled content doesn't bleed through the frozen name column */
  table.matrix tbody tr:nth-child(even) td:first-child { background-color: rgb(30 41 59); }
  table.matrix tbody tr:nth-child(odd) td:first-child { background-color: rgb(15 23 42); }
  table.matrix tbody td:first-child { box-shadow: 4px 0 6px -4px rgb(0 0 0 / .6); }
  /* hairline dividers between rows */
  table.matrix tbody tr + tr { border-top: 1px solid rgb(30 41 59 / .5); }
  /* row hover for readability across wide rows */
  table.matrix tbody tr:hover td { background-color: rgb(51 65 85 / .45); }
  table.matrix tbody tr:hover td:first-child { background-color: rgb(51 65 85); }
  .tgl { cursor: pointer; user-select: none; }
  .tgl:active { transform: scale(.9); }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<!-- subtle top glow -->
<div class="pointer-events-none absolute inset-x-0 top-0 h-56 bg-gradient-to-b from-emerald-950/50 via-slate-950/20 to-transparent"></div>
<div class="relative max-w-3xl mx-auto px-4 pb-16">

  <header class="pt-6 pb-5 flex items-start justify-between gap-3">
    <div>
      <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-widest uppercase bg-slate-800/80 border border-slate-700/70 text-slate-400">Regu 3 &bull; Admin Panel</span>
      <h1 class="mt-2 text-2xl font-extrabold tracking-tight">🔐 Kelola Kas</h1>
    </div>
    <div class="shrink-0 mt-1 flex flex-col items-end gap-1.5">
      <a href="/" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-full text-[11px] border border-slate-700/70 bg-slate-900/60 text-slate-400 hover:text-emerald-300 hover:border-emerald-700/60">← Publik</a>
      <a href="/spin.html" title="Roda Backup Libur" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-full text-[11px] border border-amber-500/40 bg-amber-500/10 text-amber-200 hover:bg-amber-500/20">🎡 Roda Backup</a>
    </div>
  </header>

  <!-- Login barrier -->
  <div id="login" class="max-w-sm mx-auto rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-5">
    <h2 class="font-semibold mb-3">Masuk sebagai admin</h2>
    <input id="pw" type="password" placeholder="Password admin" autocomplete="current-password"
      class="w-full bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 mb-3 text-sm outline-none focus:border-emerald-500" />
    <button id="btnLogin" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 font-semibold">Masuk</button>
    <p id="loginErr" class="hidden text-rose-400 text-sm mt-2"></p>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <!-- Admin control bar: balance + quick actions -->
    <div class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm px-4 py-3 mb-4 flex flex-wrap items-center justify-between gap-2">
      <div class="text-sm text-slate-400">Saldo: <span id="stBalance" class="font-extrabold tabular-nums text-amber-300">-</span>
        <span class="text-xs">(<span id="stIncome" class="text-emerald-400 tabular-nums"></span> / <span id="stExpense" class="text-rose-400 tabular-nums"></span>)</span>
      </div>
      <div class="flex gap-1.5">
        <button id="btnWA" class="text-xs px-3 py-1.5 rounded-full border border-emerald-700/60 bg-emerald-950/50 text-emerald-300 hover:bg-emerald-900/60">📋 Salin Rekap WA</button>
        <button id="btnGenImage" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-amber-600/50 bg-amber-700/20 text-amber-300 hover:bg-amber-700/40">📸 Buat Gambar Laporan</button>
        <button id="btnLogout" class="text-xs px-3 py-1.5 rounded-full border border-slate-700/70 bg-slate-800/60 text-slate-400 hover:text-slate-200">Keluar</button>
      </div>
    </div>
    <div id="err" class="hidden mb-3 p-3 rounded-2xl bg-rose-950/60 border border-rose-800/60 text-rose-200 text-sm"></div>

    <!-- 1. Kelola Iuran Anggota -->
    <section class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-4 mb-4">
      <h2 class="font-semibold mb-3 text-sm border-l-2 border-emerald-500 pl-2.5">📋 Kelola Iuran Anggota <span class="text-slate-500 font-normal">(ketuk badge untuk ubah)</span></h2>
      <!-- Month filter + add month -->
      <div class="flex flex-wrap gap-1.5 items-center" id="chips"></div>
      <div class="flex gap-1.5 mt-2 mb-3">
        <input id="newMonth" type="month" min="2026-07"
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3 py-2 text-sm" />
        <button id="btnAddMonth" class="text-xs px-3 py-2 rounded-xl border border-slate-700/70 bg-slate-800/60 hover:bg-slate-700/60">+ Tampilkan bulan</button>
      </div>
      <div class="flex flex-wrap gap-1.5 mb-2">
        <button id="pillAll" class="px-2.5 py-1 rounded-full text-xs border bg-slate-800 border-slate-700 text-slate-400">Semua Anggota (<span id="pillAllN">0</span>)</button>
        <button id="pillUnpaid" class="px-2.5 py-1 rounded-full text-xs border bg-slate-800 border-slate-700 text-slate-400">🔴 Belum Lunas Bulan Ini (<span id="pillUnpaidN">0</span>)</button>
      </div>
      <div class="scroll-x rounded-xl border border-slate-800/70">
        <table class="matrix w-full text-sm whitespace-nowrap">
          <thead><tr id="mHead" class="bg-slate-800 text-slate-300 text-xs"></tr></thead>
          <tbody id="mBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 2. Target Dana & Donasi Sibagi -->
    <section class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-4 mb-4">
      <h2 class="font-semibold mb-3 text-sm border-l-2 border-amber-500 pl-2.5">🎯 Target Dana &amp; Donasi Sibagi</h2>
      <form id="fGoal" class="grid gap-2">
        <input id="goalTitleIn" placeholder="Nama/Judul Target (cth: Acara Makan Regu)" required
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        <input id="goalTargetIn" type="number" min="1" step="1" placeholder="Target Nominal (Rp)" required
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        <input id="goalUrlIn" type="url" placeholder="URL Sibagi (cth: https://sibagi.com/nama_akun)"
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        <input id="goalExtIn" type="number" min="0" step="1" placeholder="Total Donasi Sibagi / Dana Luar (Rp)"
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        <button class="bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-xl py-2.5 text-sm font-bold">💾 Simpan Target &amp; Sibagi</button>
        <p id="goalMsg" class="hidden text-xs"></p>
      </form>
    </section>

    <!-- 3. Pencatatan Pengeluaran Kas -->
    <section class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-4 mb-4">
      <h2 class="font-semibold mb-3 text-sm border-l-2 border-rose-500 pl-2.5">🧾 Pencatatan Pengeluaran Kas</h2>
      <form id="fExp" class="grid gap-2 mb-3">
        <input id="expDesc" placeholder="Deskripsi (cth: Beli konsumsi rapat)" required
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        <div class="grid grid-cols-2 gap-2">
          <input id="expAmt" type="number" min="1" step="1" placeholder="Nominal (Rp)" required
            class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
          <input id="expDate" type="date" required
            class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        </div>
        <button class="bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 text-sm font-semibold">+ Tambah pengeluaran</button>
      </form>
      <div id="expList" class="space-y-2"></div>
    </section>

    <!-- 4. Daftar & Tambah Anggota -->
    <section class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-4">
      <h2 class="font-semibold mb-3 text-sm border-l-2 border-sky-500 pl-2.5">👥 Daftar &amp; Tambah Anggota</h2>
      <form id="fMem" class="flex gap-2 mb-3 items-center">
        <input id="memName" placeholder="Nama anggota baru" required
          class="flex-1 bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
        <input id="memStartMonth" type="month" value="" min="2026-07"
          class="bg-slate-950/70 border border-slate-700/70 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-emerald-500 w-[160px]"
          title="Bulan wajib iuran mulai" />
        <button class="bg-emerald-600 hover:bg-emerald-500 rounded-xl px-5 py-2.5 text-sm font-semibold">+ Tambah</button>
      </form>
      <div id="memList" class="flex flex-wrap gap-1.5"></div>
    </section>
  </div>

  <!-- Custom nominal modal -->
  <div id="payModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
    <div class="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-5">
      <div id="payModalTitle" class="font-semibold text-sm mb-3">Setor Iuran</div>
      <div class="flex flex-wrap gap-1.5 mb-2">
        <button data-chip="10000" class="payChip px-2.5 py-1 rounded-full text-xs border border-slate-700 bg-slate-800 text-slate-300">Rp 10rb</button>
        <button data-chip="20000" class="payChip px-2.5 py-1 rounded-full text-xs border border-slate-700 bg-slate-800 text-slate-300">Rp 20rb</button>
        <button data-chip="50000" class="payChip px-2.5 py-1 rounded-full text-xs border border-slate-700 bg-slate-800 text-slate-300">Rp 50rb</button>
        <button data-chip="100000" class="payChip px-2.5 py-1 rounded-full text-xs border border-slate-700 bg-slate-800 text-slate-300">Rp 100rb</button>
      </div>
      <input id="payAmt" type="number" min="1" step="1" inputmode="numeric" placeholder="Nominal (Rp)"
        class="w-full bg-slate-950/70 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-emerald-500" />
      <p id="payModalErr" class="hidden text-rose-400 text-xs mt-1.5"></p>
      <div class="grid gap-2 mt-3">
        <button id="btnSavePay" class="bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 text-sm font-bold">💾 Simpan Setoran</button>
        <button id="btnClearPay" class="border border-rose-800/60 bg-rose-950/50 hover:bg-rose-900/50 text-rose-300 rounded-xl py-2 text-xs">Jadikan belum lunas</button>
        <button id="btnCancelPay" class="text-slate-500 hover:text-slate-300 text-xs py-1">Batal</button>
      </div>
    </div>
  </div>

  <!-- Image report preview modal -->
  <div id="imageModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
    <div class="w-full max-w-md">
      <div class="rounded-2xl border border-slate-700 bg-slate-900 p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-sm text-slate-200">📸 Preview Laporan</span>
          <button id="btnCloseImage" class="text-slate-500 hover:text-slate-200 text-lg leading-none">&times;</button>
        </div>
        <canvas id="reportCanvas" class="w-full rounded-xl border border-slate-700" width="540" height="960"></canvas>
        <div class="flex gap-2">
          <button id="btnDownloadImg" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl">📥 Unduh PNG</button>
          <button id="btnCopyImg" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2 rounded-xl">📋 Salin Gambar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const namaBulan = ym => { const [y,m] = ym.split('-'); return BULAN[Number(m)-1] + ' ' + y; };
const tglID = iso => { const [y,m,d] = iso.split('-'); return `${Number(d)} ${BULAN[Number(m)-1]} ${y}`; };
const MONTH_RE = /^\d{4}-(0[1-9]|1[0-2])$/;
// current month (local time) for the "Bulan Ini" highlight
const _now = new Date();
const THIS_MONTH = `${_now.getFullYear()}-${String(_now.getMonth() + 1).padStart(2, '0')}`;

let TOKEN = sessionStorage.getItem('kas_token') || '';
let ALL_MONTHS = [];
let ACTIVE = [];
let DATA = null;
let SHOW_UNPAID_ONLY = false;
let GOAL_PREFILLED = false;

// A member owes dues only from their start_month onward (and must be active).
// Pre-join months are exempt, not unpaid ("N/A").
const MEMBER_START_MONTH = m => m.start_month || '2026-07';
const IS_ELIGIBLE = (m, mo) => !!m && m.is_active !== 0 && typeof mo === 'string' && mo >= MEMBER_START_MONTH(m);

function unpaidList(d) {
  return (d.members || []).filter(m => IS_ELIGIBLE(m, THIS_MONTH) && !m.paid[THIS_MONTH]);
}
function paidCount(d) {
  return (d.members || []).filter(m => IS_ELIGIBLE(m, THIS_MONTH) && m.paid[THIS_MONTH]).length;
}

async function copyText(text, btn, doneLabel) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    // fallback for non-secure contexts / older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  if (btn && doneLabel) {
    const orig = btn.textContent;
    if (ok) {
      btn.textContent = doneLabel;
      setTimeout(() => { btn.textContent = orig; }, 1800);
    }
  }
  return ok;
}

function buildWAText() {
  const d = DATA;
  if (!d) return '';
  const bulan = namaBulan(THIS_MONTH);
  const unpaid = unpaidList(d);
  const paidN = paidCount(d);
  const totalN = (d.members || []).length;
  const lines = [
    `📢 UPDATE KAS REGU 3 (${bulan})`,
    `💰 Saldo Kas: ${rp(d.current_balance)}`,
    `(Masuk: ${rp(d.total_income)} | Keluar: ${rp(d.total_expense)})`,
    '',
    `🔴 Belum Lunas (${bulan}):`
  ];
  if (unpaid.length) unpaid.forEach(m => lines.push(`- ${m.name}`));
  else lines.push('- Nihil, semua sudah lunas 🎉');
  lines.push(
    '',
    `🟢 Lunas: ${paidN}/${totalN} orang`,
    '',
    'Cek rincian & mutasi lengkap:',
    `👉 ${location.origin}`
  );
  return lines.join('\n');
}

const auth = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN });
const showErr = msg => {
  const e = document.getElementById('err');
  if (!msg) { e.classList.add('hidden'); return; }
  e.textContent = msg; e.classList.remove('hidden');
};

// ---------- Auth ----------
async function doLogin() {
  const pw = document.getElementById('pw').value;
  const le = document.getElementById('loginErr');
  le.classList.add('hidden');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login gagal');
    TOKEN = d.token;
    sessionStorage.setItem('kas_token', TOKEN);
    enter();
  } catch (e) { le.textContent = e.message; le.classList.remove('hidden'); }
}

function enter() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
  document.getElementById('expDate').value = new Date().toISOString().slice(0, 10);
  load();
}

// ---------- Load + render ----------
async function load() {
  showErr(null);
  try {
    const qs = ACTIVE.length ? '?months=' + ACTIVE.join(',') : '';
    const r = await fetch('/api/summary' + qs);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    ALL_MONTHS = DATA.available_months || DATA.months || [];
    if (!ACTIVE.length) ACTIVE = [...(DATA.months || [])];
    render();
  } catch (e) { showErr('Gagal memuat: ' + e.message); }
}

function render() {
  const d = DATA;
  document.getElementById('stIncome').textContent = rp(d.total_income);
  document.getElementById('stExpense').textContent = rp(d.total_expense);
  document.getElementById('stBalance').textContent = rp(d.current_balance);

  // chips
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  ALL_MONTHS.forEach(m => {
    const on = ACTIVE.includes(m);
    const b = document.createElement('button');
    b.textContent = namaBulan(m);
    b.className = 'px-2.5 py-1 rounded-full text-xs border ' +
      (on ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400');
    b.onclick = () => {
      if (on) { if (ACTIVE.length > 1) ACTIVE = ACTIVE.filter(x => x !== m); }
      else { ACTIVE.push(m); ACTIVE.sort(); }
      load();
    };
    chips.appendChild(b);
  });

  // prefill goal form once (don't clobber typing on re-renders)
  if (!GOAL_PREFILLED && d.goal) {
    document.getElementById('goalTitleIn').value = d.goal.title || '';
    document.getElementById('goalTargetIn').value = d.goal.target_amount || '';
    document.getElementById('goalUrlIn').value = d.goal.sibagi_url || '';
    document.getElementById('goalExtIn').value = d.goal.external_funds || '';
    GOAL_PREFILLED = true;
  }

  // matrix (+ "Bulan Ini" badge on the current month, Total Bayar on the far right)
  document.getElementById('mHead').innerHTML =
    '<th class="text-left px-3 py-2 bg-slate-800 border-b-2 border-b-transparent">Anggota</th>' +
    d.months.map(m => {
      const isNow = m === THIS_MONTH;
      return `<th class="px-3 py-2 text-center border-b-2 ${isNow ? 'bg-amber-950/50 border-b-amber-500/60' : 'bg-slate-800 border-b-transparent'}">${namaBulan(m)}${isNow ? '<span class="ml-1 px-1.5 py-px rounded text-[10px] font-bold bg-amber-500/20 border border-amber-500/50 text-amber-300 whitespace-nowrap">Bulan Ini</span>' : ''}</th>`;
    }).join('') +
    '<th class="px-3 py-2 bg-slate-800 text-right border-b-2 border-b-transparent">Total Bayar</th>';
  const body = document.getElementById('mBody');
  body.innerHTML = '';
  const fee = d.month_fee || 10000;
  let rows = d.members.slice();
  if (SHOW_UNPAID_ONLY) rows = rows.filter(m => IS_ELIGIBLE(m, THIS_MONTH) && !m.paid[THIS_MONTH]);
  const totalN = (d.members || []).length;
  document.getElementById('pillAllN').textContent = totalN;
  document.getElementById('pillUnpaidN').textContent = unpaidList(d).length;
  const pillAll = document.getElementById('pillAll');
  const pillUnpaid = document.getElementById('pillUnpaid');
  pillAll.className = 'px-2.5 py-1 rounded-full text-xs border ' +
    (!SHOW_UNPAID_ONLY ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400');
  pillUnpaid.className = 'px-2.5 py-1 rounded-full text-xs border ' +
    (SHOW_UNPAID_ONLY ? 'bg-rose-700 border-rose-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400');
  if (!rows.length && SHOW_UNPAID_ONLY) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="${d.months.length + 2}" class="px-3 py-6 text-center text-sm text-emerald-300">🎉 Semua anggota sudah lunas di bulan ini!</td>`;
    body.appendChild(tr);
  }
  rows.forEach((m, i) => {
    const tr = document.createElement('tr');
    tr.className = i % 2 ? 'bg-slate-800/40' : 'bg-slate-800/10';
    const dim = m.is_active ? '' : ' opacity-50';
    const total = m.total_paid ?? (m.paid_count * fee);
    let html = `<td class="px-3 py-2 font-medium${dim}">${m.name}</td>`;
    d.months.forEach(mo => {
      const nowCls = mo === THIS_MONTH ? ' bg-amber-400/5' : '';
      // bulan sebelum start_month = exempt (N/A), bukan tunggakan
      if (!IS_ELIGIBLE(m, mo)) {
        html += `<td class="px-3 py-2 text-center${nowCls}"><span title="Mulai wajib iuran ${namaBulan(MEMBER_START_MONTH(m))}" class="inline-block px-2.5 py-0.5 rounded-full text-xs bg-slate-900/50 border border-slate-800 text-slate-600 select-none">N/A</span></td>`;
        return;
      }
      const paid = m.paid[mo];
      const amt = paid ? Number((m.amounts || {})[mo] ?? fee) : 0;
      const custom = paid && amt !== fee;
      const label = paid ? (custom ? '✓ ' + shortAmt(amt) : '✓') : '–';
      html += `<td class="px-3 py-2 text-center${nowCls}"><span data-mid="${m.id}" data-mo="${mo}" data-paid="${paid ? 1 : 0}" data-amt="${amt}" title="${paid ? rp(amt) : 'Belum lunas — ketuk untuk lunas Rp 10.000, pensil untuk nominal kustom'}" class="tgl inline-block px-2.5 py-0.5 rounded-full text-xs border ` +
        (paid ? (custom ? 'bg-emerald-800/80 border-amber-500/60 text-amber-200">' : 'bg-emerald-900/60 border-emerald-700 text-emerald-300">')
              : 'bg-slate-900 border-slate-700 text-slate-500">') + label + '</span>' +
        ` <button data-edit="${m.id}|${mo}" title="Nominal kustom" class="text-slate-500 hover:text-amber-300 text-xs px-1">✏️</button></td>`;
    });
    html += `<td data-total-for="${m.id}" data-total="${total}" class="px-3 py-2 text-right font-mono font-bold text-amber-400 whitespace-nowrap">${rp(total)}</td>`;
    tr.innerHTML = html;
    body.appendChild(tr);
  });
  body.querySelectorAll('.tgl').forEach(el => {
    el.onclick = () => togglePay(Number(el.dataset.mid), el.dataset.mo, el.dataset.paid !== '1');
  });
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const [mid, mo] = btn.dataset.edit.split('|');
      const m = (DATA.members || []).find(x => String(x.id) === String(mid));
      openPayModal(m, mo);
    };
  });

  // expenses
  const ex = document.getElementById('expList');
  ex.innerHTML = d.expenses.length ? '' : '<div class="text-slate-500 text-sm">Belum ada pengeluaran.</div>';
  d.expenses.forEach(e => {
    const div = document.createElement('div');
    div.className = 'rounded-xl border border-slate-800/70 bg-slate-950/60 px-3.5 py-2 flex justify-between items-center gap-2';
    div.innerHTML = `<div><div class="text-sm">${e.description}</div><div class="text-[11px] text-slate-500 tabular-nums">${tglID(e.expense_date)} &bull; ${rp(e.amount)}</div></div>`;
    const del = document.createElement('button');
    del.textContent = '🗑';
    del.className = 'px-2.5 py-1.5 rounded-xl bg-rose-950/60 border border-rose-800/60 text-sm';
    del.onclick = async () => {
      if (!confirm(`Hapus pengeluaran "${e.description}" (${rp(e.amount)})?`)) return;
      const r = await fetch('/api/expenses/' + e.id, { method: 'DELETE', headers: auth() });
      if (r.status === 401) return logout();
      if (!r.ok) { const t = await r.json(); return showErr(t.error || 'Gagal menghapus.'); }
      load();
    };
    div.appendChild(del);
    ex.appendChild(div);
  });

  // members
  const ml = document.getElementById('memList');
  ml.innerHTML = '';
  d.members.forEach(m => {
    const b = document.createElement('button');
    b.className = 'px-2.5 py-1 rounded-full text-xs border ' +
      (m.is_active ? 'bg-slate-800 border-slate-600 text-slate-200' : 'bg-slate-900 border-slate-800 text-slate-500 line-through');
    b.textContent = (m.is_active ? '✓ ' : '') + m.name;
    b.title = m.is_active
      ? `Mulai wajib: ${namaBulan(m.start_month || '2026-07')}\nKetuk untuk nonaktifkan`
      : 'Nonaktif';
    b.onclick = async () => {
      if (!confirm((m.is_active ? 'Nonaktifkan ' : 'Aktifkan kembali ') + m.name + '?')) return;
      const r = await fetch('/api/members', {
        method: 'POST', headers: auth(),
        body: JSON.stringify({ id: m.id, is_active: m.is_active ? 0 : 1 })
      });
      if (r.status === 401) return logout();
      load();
    };
    ml.appendChild(b);
  });
}

let PAY_TARGET = null; // { member_id, month_period, name }
const shortAmt = a => a >= 1000 && a % 1000 === 0 ? (a / 1000) + 'k' : String(a);

function badgeCls(paid, amt, fee) {
  if (!paid) return 'bg-slate-900 border-slate-700 text-slate-500';
  return amt !== fee
    ? 'bg-emerald-800/80 border-amber-500/60 text-amber-200'
    : 'bg-emerald-900/60 border-emerald-700 text-emerald-300';
}
function badgeLabel(paid, amt, fee) {
  if (!paid) return '–';
  return amt !== fee ? '✓ ' + shortAmt(amt) : '✓';
}

async function togglePay(member_id, month_period, status, amount) {
  showErr(null);
  const fee = (DATA && DATA.month_fee) || 10000;
  const amt = amount === undefined ? fee : amount;
  const el = document.querySelector(`.tgl[data-mid="${member_id}"][data-mo="${month_period}"]`);
  const oldPaid = el ? el.dataset.paid === '1' : false;
  const oldAmt = el ? Number(el.dataset.amt || 0) : 0;
  const r = await fetch('/api/payments/toggle', {
    method: 'POST', headers: auth(),
    body: JSON.stringify({ member_id, month_period, status, amount: status ? amt : undefined })
  });
  if (r.status === 401) return logout();
  if (!r.ok) { const t = await r.json(); return showErr(t.error || 'Gagal menyimpan.'); }
  // instant UI flip (badge + Total Bayar), then re-sync
  if (el) {
    el.dataset.paid = status ? '1' : '0';
    el.dataset.amt = status ? String(amt) : '0';
    el.title = status ? rp(amt) : 'Belum lunas';
    el.className = 'tgl inline-block px-2.5 py-0.5 rounded-full text-xs border ' + badgeCls(status, amt, fee);
    el.textContent = badgeLabel(status, amt, fee);
    const tc = document.querySelector(`[data-total-for="${member_id}"]`);
    if (tc) {
      const cur = Number(tc.dataset.total || 0) - (oldPaid ? oldAmt : 0) + (status ? amt : 0);
      tc.dataset.total = Math.max(0, cur);
      tc.textContent = rp(tc.dataset.total);
    }
  }
  load();
}

function openPayModal(m, mo) {

  document.getElementById('payAmt').value = m.paid[mo] ? Number((m.amounts || {})[mo] ?? fee) : fee;

// ---------- Report Image Generator (9:16, 1080×1920, native canvas) ----------
const RPT_C = {
  bg: '#020617', card: '#0f172a', stroke: '#1e293b',
  text: '#f1f5f9', mute: '#94a3b8', emerald: '#10b981', amber: '#f59e0b', rose: '#f43f5e',
};
const FULL_BULAN = ['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];

function rptRoundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Status badge untuk matriks laporan: hijau Lunas / amber nominal kustom / merah belum / abu nonaktif
function rptStatus(m) {
  const C = RPT_C;
  const mos = ACTIVE.length ? ACTIVE : [THIS_MONTH];
  if (m.is_active === 0) return { label: 'NONAKTIF', color: C.mute };
  // only count months from start_month onward as mandatory
  const reqMos = mos.filter(mo => IS_ELIGIBLE(m, mo));
  if (reqMos.length === 0) return { label: 'BELUM', color: C.mute };
  const pc = reqMos.filter(mo => m.paid[mo]).length;
  if (pc === 0) return { label: 'BELUM', color: C.rose };
  const fee = (DATA && DATA.month_fee) || 10000;
  if (reqMos.length === 1) {
    const amt = Number((m.amounts || {})[reqMos[0]] ?? fee);
    return amt !== fee
      ? { label: 'RP ' + String(shortAmt(amt)).toUpperCase(), color: C.amber }
      : { label: 'LUNAS', color: C.emerald };
  }
  return pc === reqMos.length
    ? { label: 'LUNAS', color: C.emerald }
    : { label: pc + '/' + reqMos.length + ' LUNAS', color: C.amber };
}

// Lightweight measureText shim so the generator works in headless node too.
const ctxMeasureText = (ctx, s) => ({ width: Math.ceil(s.length * 1.04) });

// Auto-wrap long text to n lines at `maxW` (breaks on word boundaries); draws center-aligned.
function drawWrapped(ctx, text, cx, topY, n, maxW, font, fillStyle) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = fillStyle;
  ctx.textAlign = 'center';
  const words = String(text).split(' ');
  const rows = [''];
  for (const w of words) {
    const trial = rows[rows.length - 1] ? rows[rows.length - 1] + ' ' + w : w;
    if (rows[rows.length - 1] && (ctx.measureText(trial).width || 0) > maxW) rows.push(w);
    else rows[rows.length - 1] = trial;
  }
  if (rows.length > n) rows.length = n; // overflow beyond n lines is clipped
  const lh = Math.ceil(parseFloat(font.split(/\d+(\.\d+)?px/)[1] || 40) * 1.35) || 56;
  rows.forEach((row, j) => { if (row) ctx.fillText(row, cx, topY + j * lh); });
  ctx.restore();
  return rows.length;
}

function generateReportCanvas(d, canvas) {
  const ctx = canvas.getContext('2d');
  const C = RPT_C, W = 1080, H = 1920, PX = 48;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  // --- 1. Header ---
  ctx.fillStyle = '#064e3b';
  rptRoundRect(ctx, PX, 56, W - PX * 2, 56, 12);
  ctx.fill();
  ctx.fillStyle = C.emerald;
  ctx.font = '600 28px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('REGU 3 • LAPORAN OPERASIONAL KAS', W / 2, 92);

  const mos = ACTIVE.length ? ACTIVE : [THIS_MONTH];
  const [yy, mm] = mos[0].split('-');
  const periodTitle = mos.length === 1
    ? 'REKAPITULASI BULAN ' + FULL_BULAN[Number(mm) - 1] + ' ' + yy
    : 'REKAPITULASI PERIODE ' + mos.map(x => FULL_BULAN[Number(x.split('-')[1]) - 1]).join(' / ') + ' ' + yy;

  // --- 1. Title (auto-wrap jika melebihi lebar aman ~120px padding tiap sisi) ---
  ctx.textAlign = 'center';
  const TITLE_MAX_W = W - 120, TITLE_BASE = 'bold 48px system-ui, sans-serif', TITLE_FALLBACK = 'bold 36px system-ui, sans-serif';
  ctx.font = TITLE_BASE;
  const tw = ctx.measureText(periodTitle).width || ctxMeasureText(ctx, periodTitle).width;
  if (tw > TITLE_MAX_W) {
    drawWrapped(ctx, periodTitle, W / 2, 152, 2, TITLE_MAX_W, TITLE_FALLBACK, C.text);
  } else {
    ctx.fillText(periodTitle, W / 2, 168);
  }
  ctx.fillStyle = C.mute;
  ctx.font = '28px system-ui, sans-serif';
  ctx.fillText('Dicetak ' + tglID(new Date().toISOString().slice(0, 10)), W / 2, 228);
  // --- 2. Kartu statistik utama ---
  const cardY = 270, cardH = 180, gap = 20;
  const cardW = (W - PX * 2 - gap * 2) / 3;
  const pm = (d.per_month || []).filter(p => mos.includes(p.month));
  const masuk = pm.length ? pm.reduce((s, p) => s + (p.total || 0), 0) : d.total_income;
  const keluar = pm.length
    ? ((d.expenses || []).filter(e => mos.includes(String(e.expense_date || '').slice(0, 7))).reduce((s, e) => s + (e.amount || 0), 0))
    : d.total_expense;
  const stats = [
    { label: 'SALDO KAS', value: d.current_balance, color: C.emerald },
    { label: 'TOTAL MASUK', value: masuk, color: C.amber },
    { label: 'TOTAL KELUAR', value: keluar, color: C.rose },
  ];
  stats.forEach((s, i) => {
    const cx = PX + i * (cardW + gap);
    rptRoundRect(ctx, cx, cardY, cardW, cardH, 16);
    ctx.fillStyle = C.card;
    ctx.fill();
    ctx.strokeStyle = C.stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = C.mute;
    ctx.font = '26px system-ui, sans-serif';
    ctx.fillText(s.label, cx + 20, cardY + 44);
    ctx.fillStyle = s.color;
    ctx.font = 'bold 56px system-ui, sans-serif';
    ctx.fillText(rp(s.value), cx + 20, cardY + 130);
  });

  // --- 3. Target / Goal (jika aktif) ---
  let y = cardY + cardH + 40;
  if (d.goal) {
    const g = d.goal, gw = W - PX * 2;
    rptRoundRect(ctx, PX, y, gw, 220, 16);
    ctx.fillStyle = C.card;
    ctx.fill();
    ctx.strokeStyle = C.stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
    const pct = Math.max(0, Math.min(100, g.percentage || 0));
    ctx.textAlign = 'left';
    ctx.fillStyle = C.amber;
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText('🎯 ' + (g.title || 'Target Dana'), PX + 28, y + 54);
    ctx.textAlign = 'right';
    ctx.fillStyle = C.text;
    ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText(Math.round(pct) + '%', PX + gw - 28, y + 58);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.mute;
    ctx.font = '26px system-ui, sans-serif';
    ctx.fillText(rp(g.total_collected) + '  terkumpul dari target  ' + rp(g.target_amount), PX + 28, y + 104);
    const barX = PX + 28, barY = y + 132, barW = gw - 56, barH = 30;
    rptRoundRect(ctx, barX, barY, barW, barH, barH / 2);
    ctx.fillStyle = C.stroke;
    ctx.fill();
    if (pct > 0) {
      rptRoundRect(ctx, barX, barY, Math.max(barH, barW * pct / 100), barH, barH / 2);
      ctx.fillStyle = C.emerald;
      ctx.fill();
    }
    ctx.fillStyle = C.mute;
    ctx.font = '24px system-ui, sans-serif';
    ctx.fillText('Sisa ' + rp(g.remaining), PX + 28, y + 198);
    y += 260;
  }

  // --- 4. Matriks ringkas anggota (2 kolom) ---
  ctx.textAlign = 'left';
  ctx.fillStyle = C.mute;
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText('STATUS ANGGOTA (' + (d.members || []).length + ')', PX, y + 8);
  y += 52;
  const cellH = 76, cellGap = 12;
  const cellW = (W - PX * 2 - cellGap) / 2;
  (d.members || []).forEach((m, i) => {
    const total = (d.members || []).length;
    const isLastAndOdd = (i === total - 1 && total % 2 === 1);
    const cx = isLastAndOdd ? PX : PX + (i % 2) * (cellW + cellGap);
    const cw = isLastAndOdd ? cellW * 2 + cellGap : cellW;
    const cy = y + Math.floor(i / 2) * (cellH + cellGap);
    const st = rptStatus(m);
    rptRoundRect(ctx, cx, cy, cw, cellH, 12);
    ctx.fillStyle = C.card;
    ctx.fill();
    ctx.strokeStyle = st.color === C.emerald ? '#0f766e' : st.color === C.rose ? '#be123c' : st.color === C.amber ? '#92400e' : '#334155';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = C.text;
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(String(m.name).toUpperCase(), cx + 18, cy + 34);
    ctx.fillStyle = C.mute;
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText(m.is_active === 0 ? 'nonaktif' : 'regu 3', cx + 18, cy + 62);
    // badge status — right-aligned within the card
    ctx.font = 'bold 24px system-ui, sans-serif';
    const bw = ctx.measureText(st.label).width + 36;
    const bx = cx + cw - bw - 14;
    rptRoundRect(ctx, bx, cy + 14, bw, 48, 10);
    ctx.fillStyle = st.color === C.emerald ? '#064e3b' : st.color === C.rose ? '#4c0519' : st.color === C.amber ? '#451a03' : '#1e293b';
    ctx.fill();
    ctx.fillStyle = st.color;
    ctx.fillText(st.label, bx + 18, cy + 46);
  });
  y += Math.ceil((d.members || []).length / 2) * (cellH + cellGap);

  // --- 5. Footer ---
  ctx.fillStyle = C.mute;
  ctx.font = '26px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Dikelola transparan via Sistem Kas & Operasional Regu 3', W / 2, H - 88);
  ctx.font = '22px system-ui, sans-serif';
  ctx.fillText(location.hostname, W / 2, H - 52);
}

    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = fname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};
document.getElementById('btnCopyImg').onclick = async () => {
  const pc = document.getElementById('reportCanvas');
  if (!pc.width) return;
  try {
    // promise-form Blob required: some Safari builds reject a plain blob in ClipboardItem
    const img = pc.toBlob ? (() => new Promise((res, rej) => pc.toBlob(b => b ? res(b) : rej(new Error('render gagal')), 'image/png')))() : null;
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': img })]);
    const b = document.getElementById('btnCopyImg');
    b.textContent = '✓ Tersalin!';
    setTimeout(() => { b.textContent = '📋 Salin Gambar'; }, 2000);
  } catch (e) {
    // fallback: browser tanpa ClipboardItem image (mis. non-HTTPS) -> unduh PNG
    document.getElementById('btnDownloadImg').click();
    showErr('Salin gambar tidak didukung browser ini — PNG diunduh sebagai gantinya.');
  }
};
</script>
</body>
