<body class="bg-slate-950 text-slate-100 min-h-screen">

<div class="pointer-events-none absolute inset-x-0 top-0 h-56 bg-gradient-to-b from-emerald-950/50 via-slate-950/20 to-transparent"></div>
<canvas id="confettiCv" class="hidden"></canvas>
<div class="relative max-w-md mx-auto px-4 pb-16">

  <header class="pt-6 pb-4 flex items-start justify-between gap-3">
    <div>
      <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-widest uppercase bg-slate-800/80 border border-slate-700/70 text-slate-400">Regu 3 &bull; Undian Backup</span>

      <p class="text-slate-400 text-xs mt-1">Putar roda untuk menentukan personil backup secara transparan.</p>
    </div>
    <a href="/" class="shrink-0 mt-1 inline-flex items-center gap-1 px-2.5 py-1.5 rounded-full text-[11px] border border-slate-700/70 bg-slate-900/60 text-slate-400 hover:text-emerald-300 hover:border-emerald-700/60">← Kas</a>
  </header>

  <div id="err" class="hidden mb-3 p-3 rounded-2xl bg-rose-950/60 border border-rose-800/60 text-rose-200 text-sm"></div>

  <!-- Wheel -->
  <section class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-4 mb-4">

    <button id="btnSpin" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl py-3 text-base font-extrabold tracking-wide">PUTAR RODA</button>
  </section>

  <!-- Name checklist -->
  <section class="rounded-2xl border border-slate-800/80 bg-slate-900/60 backdrop-blur-sm p-4 mb-4">
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-semibold text-sm border-l-2 border-emerald-500 pl-2.5">✅ Ikut Putaran (<span id="countIn">0</span>)</h2>

    <form id="fAdd" class="flex gap-2 mt-3">

<div id="stealthModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
  <div class="modal-box w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-5">

      <button id="btnCloseStealth" class="text-slate-500 hover:text-slate-300 text-xs py-1">Batal</button>

<script>
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN_FULL = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PALETTE = ['#10b981','#0ea5e9','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#eab308','#06b6d4','#f43f5e','#84cc16'];
const POINTER = -Math.PI / 2; // needle at 12 o'clock
const TAU = Math.PI * 2;

let names = [];        // {id, name, in} — in = ikut putaran
let rot = 0;           // current wheel rotation (radians)
let spinning = false;
let rigTargetId = null; // stealth: locked winner id, null = fair random
let lastWinner = null;

const cv = document.getElementById('wheel');
const ctx = cv.getContext('2d');
const showErr = msg => {
  const e = document.getElementById('err');
  if (!msg) { e.classList.add('hidden'); return; }
  e.textContent = msg; e.classList.remove('hidden');
};

// ---------- Audio (Web Audio API, no files) ----------
let AC = null;
const ac = () => (AC || (AC = new (window.AudioContext || window.webkitAudioContext)()));
function tickSound() {
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = 2200;
    g.gain.setValueAtTime(0.06, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.03);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.035);
  } catch {}
}
function fanfare() {
  try {
    const c = ac();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t = c.currentTime + i * 0.14;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}

// ---------- Confetti (tiny inline implementation) ----------
function confetti() {
  const c = document.getElementById('confettiCv');
  c.classList.remove('hidden');
  c.width = innerWidth; c.height = innerHeight;
  const x = c.getContext('2d');
  const P = Array.from({ length: 160 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.3,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
    r: Math.random() * Math.PI, vr: -0.2 + Math.random() * 0.4,
    col: PALETTE[(Math.random() * PALETTE.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const el = (t - t0) / 1000;
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r);
      x.globalAlpha = Math.max(0, 1 - el / 3.2);
      x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore();
    });
    if (el < 3.2) requestAnimationFrame(frame);
    else c.classList.add('hidden');
  })(t0);
}

// ---------- Wheel math ----------
const norm = a => ((a % TAU) + TAU) % TAU;
const activeNames = () => names.filter(n => n.in);
function idxUnderPointer(r) {
  const list = activeNames();
  if (!list.length) return -1;
  return Math.floor(norm(POINTER - r) / (TAU / list.length)) % list.length;
}

function drawWheel(highlight = -1) {
  const list = activeNames();
  const W = cv.width, cx = W / 2, cy = W / 2, R = W / 2 - 8;
  ctx.clearRect(0, 0, W, W);
  if (!list.length) {
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.fillStyle = '#64748b'; ctx.font = 'bold 26px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Centang nama dulu', cx, cy);
    return;
  }
  const arc = TAU / list.length;
  list.forEach((n, i) => {
    const a0 = rot + i * arc, a1 = a0 + arc;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#020617'; ctx.stroke();
    if (i === highlight) {
      ctx.save();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
      ctx.fillStyle = 'rgb(255 255 255 / .25)'; ctx.fill();
      ctx.restore();
    }
    // label along radius
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a0 + arc / 2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${list.length > 10 ? 20 : 24}px system-ui`;
    ctx.fillStyle = '#020617';
    const label = n.name.length > 12 ? n.name.slice(0, 11) + '…' : n.name;
    ctx.fillText(label, R - 14, 0);
    ctx.restore();
  });
  // hub
  ctx.beginPath(); ctx.arc(cx, cy, 34, 0, TAU);
  ctx.fillStyle = '#0f172a'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#10b981'; ctx.stroke();
  ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 30px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('★', cx, cy + 2);
}

// ---------- Spin: 10 skenario settle organik (dipilih acak per putaran) ----------
// SNAP_ESCAPE, DEEP_RECOIL, DEAD_STOP, DOUBLE_WOBBLE, SLOW_CREEP,
// SOFT_CUSHION, PIN_CHATTER, HEAVY_HESITATION, MICRO_RECOIL, SMOOTH_DRIFT.
// Semua dirumuskan relatif thd tengah segmen pemenang & berakhir TEPAT di sana,
// jadi stealth target 100% akurat apa pun skenarionya.
let settling = false; // true during the final spring-settle phase
let kickGen = 0;      // invalidates stale flipper snap-back timeouts

function kickPointer(strength) {
  // flipper deflects with the rotation, then snaps back with a tick
  const myGen = kickGen;
  const kick = document.getElementById('pointerKick');
  tickSound();
  kick.style.transform = `translateX(-50%) rotate(${(8 + 22 * strength).toFixed(1)}deg)`;
  setTimeout(() => {
    if (myGen === kickGen && !settling) kick.style.transform = 'translateX(-50%)';
  }, 70);
}

function spinToIndex(k) {
  const list = activeNames();
  const arc = TAU / list.length;
  const winnerId = list[k] ? list[k].id : null;
  // resting angle: center of segment k exactly under the pointer
  const delta = norm(POINTER - (rot + (k + 0.5) * arc));
  const turns = 6 + Math.floor(Math.random() * 3); // 6–8 putaran penuh
  const from = rot, to = from + turns * TAU + delta;
  // 10 skenario settle organik, dipilih acak per putaran. Semuanya dirumuskan
  // RELATIF terhadap `to` (tengah segmen k) dan berakhir TEPAT di `to` —
  // stealth target 100% akurat apa pun skenarionya.
  const R = (a, b) => a + Math.random() * (b - a);
  const SCEN = Math.floor(Math.random() * 10);
  const durSpin = 5500 + Math.random() * 1200;

  const btn = document.getElementById('btnSpin');
  btn.disabled = true;
  spinning = true;
  settling = false;
  kickGen++;
  const myGen = kickGen;

  const t0 = performance.now();
  let lastIdx = idxUnderPointer(from), lastTick = 0;
  const kick = document.getElementById('pointerKick');

  // flipper digerakkan kecepatan roda selama fase pegas
  const flipState = { prev: 0, pt: 0 };

  // pemenang = posisi akhir roda berhenti (resolve by id agar tahan edit checklist)
  function endSpin() {
    rot = norm(to);
    settling = false;
    spinning = false;
    btn.disabled = false;
    kick.style.transform = 'translateX(-50%)';
    const fl = activeNames();
    let fi = winnerId !== null ? fl.findIndex(n => String(n.id) === String(winnerId)) : -1;
    if (fi < 0) fi = Math.max(0, Math.min(k, fl.length - 1));
    finish(fi);
  }

  // ---- mesin segmen: fase 1 menuju titik ancang, lalu segmen-segmen
  // berurutan, diakhiri endSpin() tepat di `to` ----
  // tiap segmen: { dur(ms), fn(s01,t)->sudut, needle, tickGap?, done? }
  // needle: 'tickvel' = ikut kecepatan + tick saat lolos pin;
  //   'vel' = ikut kecepatan tanpa suara; 'bend' = tertekuk menahan pasak;
  //   'rattle' = ikut kecepatan + derak timer; 'still' = jarum tegak diam.
  const segQueue = [];
  let segPt = 0, segIdx = -1, segTickLast = 0;
  function enqueue(segs) { segQueue.push(...segs); }
  function nextSeg(s) {
    segIdx++;
    segPt = s;
    flipState.prev = rot; flipState.pt = 0;
    segTickLast = s;
  }
  function stepFrame(s) {
    if (myGen !== kickGen) return;
    const seg = segQueue[segIdx];
    if (!seg) { endSpin(); return; }
    settling = true;
    const t = s - segPt, d = Math.max(1, seg.dur);
    const s01 = Math.min(1, t / d);
    rot = seg.fn(s01, t);
    springNeedle(seg.needle, s, t);
    const idx = idxUnderPointer(rot);
    const crossed = idx !== lastIdx;
    if (crossed) lastIdx = idx;
    if (seg.needle === 'rattle') {
      // derak cepat berdasar timer — chatter tidak menyeberang batas segmen
      if (s - segTickLast > (seg.tickGap || 55)) { segTickLast = s; tickSound(); }
    } else if (seg.needle === 'tickvel' && crossed) {
      if (s - segTickLast > (seg.tickGap || 90)) { segTickLast = s; tickSound(); }
    }
    drawWheel(idx);
    const isDone = seg.done ? seg.done(s01, t) : s01 >= 1;
    if (isDone) { nextSeg(s); }
    requestAnimationFrame(stepFrame);
  }

  // ---- jarum mengikuti karakteristik tiap segmen ----
  function springNeedle(kind, s, t) {
    if (kind === 'still') {
      kick.style.transform = 'translateX(-50%)';
      flipState.prev = rot; flipState.pt = s;
      return;
    }
    if (kind === 'bend') {
      // tertahan pasak: tertekuk maksimal + getar halus
      const bend = 24 + 3 * Math.sin(t * 0.03);
      kick.style.transform = `translateX(-50%) rotate(${bend.toFixed(1)}deg)`;
      flipState.prev = rot; flipState.pt = s;
      return;
    }
    // 'vel' (ikut kecepatan, tanpa suara), 'tickvel' (ikut kecepatan + tick
    // saat lolos pin, suara diatur stepFrame), 'rattle' (seperti vel + derak)
    const dt = Math.max(1, s - (flipState.pt || s));
    flipState.pt = s;
    const vel = (rot - flipState.prev) / (dt / 1000); // rad/s
    flipState.prev = rot;
    const gain = kind === 'rattle' ? 16 : 12;
    const deg = Math.max(-26, Math.min(26, -vel * gain));
    kick.style.transform = `translateX(-50%) rotate(${deg.toFixed(1)}deg)`;
  }

  // ---- fase 1: putaran cepat easeOutQuint menuju titik ancang skenario ----
  // Tiap skenario parkir di titik ancangnya sendiri; segmen settle selalu
  // KONTINU dari sana dan berakhir TEPAT di `to` (tengah segmen pemenang).
  const holdBack = arc * R(0.52, 0.58); // SNAP/HEAVY: nempel garis masuk
  // DEEP_RECOIL: LEWATI garis keluar 5-15% segmen (pointer sempat tunjuk
  // tetangga), lalu pegas kuat menyentak balik — "mencoba keluar, terpental"
  const overDeep = arc * R(0.55, 0.65);
  const overMicro = arc * 0.11;         // MICRO_RECOIL: tipis ~3 derajat
  const overSoft = arc * R(0.10, 0.14); // SOFT_CUSHION: sandaran bantalan
  let phase1End = to;
  if (SCEN === 0 || SCEN === 7) phase1End = to - holdBack;
  else if (SCEN === 1) phase1End = to + overDeep;
  else if (SCEN === 2) phase1End = to - arc * R(0.22, 0.28); // ancang mati
  else if (SCEN === 4) phase1End = to - arc * R(0.55, 0.60); // creep dari tetangga
  else if (SCEN === 5) phase1End = to + overSoft;
  else if (SCEN === 6) phase1End = to - arc * 0.5; // tepat di garis pin masuk
  else if (SCEN === 8) phase1End = to + overMicro;
  else if (SCEN === 9) phase1End = to - arc * R(0.58, 0.65); // drift dari tetangga
  // penanda kurva settle dihitung dari fase 1 ke mana ia mendarat
  const anchor = phase1End;

  (function frameSpin(t) {
    if (myGen !== kickGen) return; // superseded
    const p = Math.min(1, (t - t0) / durSpin);
    const eased = 1 - Math.pow(1 - p, 5); // easeOutQuint: kencang lalu melambat
    rot = from + (phase1End - from) * eased;
    const idx = idxUnderPointer(rot);
    if (idx !== lastIdx) {
      lastIdx = idx;
      if (t - lastTick > 40) { // throttle tick saat kecepatan tinggi
        lastTick = t;
        // hard flicks at speed, barely a nudge as it crawls to the peak
        kickPointer(Math.min(1, 0.12 + Math.pow(1 - p, 4) * 1.2));
      }
    }
    drawWheel(idx);
    if (p < 1) requestAnimationFrame(frameSpin);
    else { buildScenario(); nextSeg(performance.now()); requestAnimationFrame(stepFrame); }
  })(t0);

  // ---- 10 skenario settle: semua berakhir TEPAT di `to` ----
  function buildScenario() {
    const D = t => t >= 1; // selesai saat s01 mencapai 1
    switch (SCEN) {
      // 0 — SNAP_ESCAPE: merayap di garis masuk, jeda resistensi, "klek!" lolos maju
      case 0: {
        const travel = to - anchor;
        const hesitate = R(700, 1200);
        enqueue([
          { dur: hesitate, needle: 'bend', fn: (s01, t) =>
            anchor + arc * 0.003 * Math.sin(t * 0.045) * Math.exp(-t / 2500) },
          { dur: 900, needle: 'tickvel', tickGap: 90, fn: s01 => {
            const st = s01 * 0.9;
            return to - travel * Math.exp(-7 * st) * Math.cos(13 * st);
          }, done: D },
        ]);
        break;
      }
      // 1 — DEEP_RECOIL: lewat pin dalam, terpental dramatis ke belakang.
      // Fase 1 sudah melewati garis keluar (pointer menunjuk tetangga),
      // lalu pegas underdamped menyentak balik jauh ke tengah + 1 ayunan.
      case 1: {
        const O = anchor - to, W = 11, Z = 0.14, T = 1600;
        enqueue([
          { dur: T, needle: 'tickvel', tickGap: 90, fn: s01 => {
            const st = s01 * (T / 1000);
            return to + O * Math.exp(-Z * W * st) * Math.cos(W * st);
          }, done: D },
        ]);
        break;
      }
      // 2 — DEAD_STOP: berhenti mati presisi, tanpa pegas
      case 2: {
        enqueue([
          { dur: 700, needle: 'still', fn: s01 => {
            const e = 1 - Math.pow(1 - s01, 4); // easeOutQuart pendek
            return anchor + (to - anchor) * e;
          }, done: D },
          { dur: 260, needle: 'still', fn: () => to },
        ]);
        break;
      }
      // 3 — DOUBLE_WOBBLE: ragu di atas pin, osilasi 2x kecil lalu rebah ke tujuan.
      // sin() dimulai dari 0 → kontinu dari posisi fase-1; 2 periode penuh,
      // amplitudo meluruh, tidak pernah menyeberang garis (tanpa tick, hanya
      // goyangan jarum) — pemenang tetap yang di tengah.
      case 3: {
        const side = Math.random() < 0.5 ? 1 : -1;
        const A = arc * R(0.10, 0.14);
        enqueue([
          { dur: 1500, needle: 'vel', fn: s01 => {
            const st = s01 * 1.5;
            return to + side * A * Math.sin(2 * Math.PI * 2 * s01) * Math.exp(-2.6 * st);
          }, done: D },
        ]);
        break;
      }
      // 4 — SLOW_CREEP: gesekan tinggi, merayap tanpa lonjakan pegas.
      // Fase 1 parkir di segmen tetangga; roda merayap smoothstep ~2 detik
      // menembus garis masuk sampai ke tengah, tick pelan tiap batas.
      case 4: {
        enqueue([
          { dur: 2100, needle: 'tickvel', tickGap: 200, fn: s01 =>
            anchor + (to - anchor) * (s01 * s01 * (3 - 2 * s01)), done: D },
        ]);
        break;
      }
      // 5 — SOFT_CUSHION: membal lembut overdamped seperti bantalan karet.
      // Fase 1 bersandar sedikit lewat tengah; kurva overdamped (dua
      // eksponensial) kembali monoton ke tengah tanpa osilasi.
      case 5: {
        const O = anchor - to, W = 9, Z = 1.15;
        const q = Math.sqrt(Z * Z - 1);
        const c1 = (1 + Z / q) / 2, c2 = (1 - Z / q) / 2; // x(0)=O, v(0)=0
        enqueue([
          { dur: 1300, needle: 'vel', fn: s01 => {
            const st = s01 * 1.3;
            const e1 = Math.exp(-W * st * (Z - q));
            const e2 = Math.exp(-W * st * (Z + q));
            return to + O * (c1 * e1 + c2 * e2);
          }, done: D },
        ]);
        break;
      }
      // 6 — PIN_CHATTER: jarum derak cepat di atas pin sebelum terkunci diam
      case 6: {
        enqueue([
          { dur: 1000, needle: 'rattle', tickGap: 55, fn: (s01, t) =>
            to + arc * 0.012 * Math.sin(t * 0.09) * (1 - s01) + (anchor - to) * (1 - s01) * (1 - s01)
          , done: D },
          { dur: 300, needle: 'still', fn: () => to },
        ]);
        break;
      }
      // 7 — HEAVY_HESITATION: mati total di garis ~300-400ms (hening),
      // lalu sisa momentum menjatuhkannya selangkah ke depan + 1 getaran.
      case 7: {
        const travel = to - anchor;
        enqueue([
          { dur: R(300, 400), needle: 'still', fn: () => anchor },
          { dur: 1100, needle: 'tickvel', tickGap: 90, fn: s01 => {
            const st = s01 * 1.1;
            return to - travel * Math.exp(-6 * st) * Math.cos(11 * st);
          }, done: D },
        ]);
        break;
      }
      // 8 — MICRO_RECOIL: membal tipis 2-3 derajat, satu sentakan kaku
      case 8: {
        const O = anchor - to;
        enqueue([
          { dur: 550, needle: 'vel', fn: s01 => {
            const st = s01 * 0.55;
            return to + O * Math.exp(-0.55 * 16 * st) * Math.cos(16 * st);
          }, done: D },
          { dur: 200, needle: 'still', fn: () => to },
        ]);
        break;
      }
      // 9 — SMOOTH_DRIFT: lewat pin tanpa hambatan, meluncur santai ke tengah.
      // Fase 1 parkir di segmen tetangga; easeOutCubic menembus garis masuk
      // ("klek" tunggal) lalu meluncur lembut sampai ke tengah.
      default: {
        enqueue([
          { dur: 1600, needle: 'tickvel', tickGap: 90, fn: s01 => {
            const e = 1 - Math.pow(1 - s01, 3); // easeOutCubic
            return anchor + (to - anchor) * e;
          }, done: D },
        ]);
        break;
      }
    }
  }
}

function doSpin() {
  showErr(null);
  if (spinning) return;
  const list = activeNames();
  if (list.length < 2) {
    showErr('Centang minimal 2 nama untuk memutar roda.');
    return;
  }
  let k;
  if (rigTargetId !== null) {
    k = list.findIndex(n => String(n.id) === String(rigTargetId));
    if (k < 0) {
      showErr('Target terkunci tidak ikut putaran. Buka kunci via trigger rahasia atau kembalikan ke acak.');
      return;
    }
  } else {
    k = Math.floor(Math.random() * list.length); // murni acak
  }
  document.getElementById('winModal').classList.add('hidden');
  document.getElementById('winModal').classList.remove('open');
  spinToIndex(k);
}

function finish(idx) {
  const list = activeNames();
  const w = list[idx];
  if (!w) return;
  lastWinner = w;
  // stealth: a locked target wins exactly once, then silently back to fair
  if (rigTargetId !== null && String(w.id) === String(rigTargetId)) rigTargetId = null;
  drawWheel(idx);
  fanfare();
  confetti();
  document.getElementById('winName').textContent = w.name;
  const m = document.getElementById('winModal');
  m.classList.remove('hidden'); m.classList.add('open');
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    return ok;
  }
}

function buildWinText() {
  if (!lastWinner) return '';
  const d = new Date();
  return [
    '🚨 HASIL UNDIAN BACKUP LIBUR - REGU 3',
    `Tanggal: ${HARI[d.getDay()]}, ${d.getDate()} ${BULAN_FULL[d.getMonth()]} ${d.getFullYear()}`,
    `Personil Terpilih: 👉 ${lastWinner.name} 👈`,
    '',
    'Hasil putaran roda transparan:',
    `👉 ${location.origin}/spin.html`,
  ].join('\n');
}

// ---------- Names ----------
function renderNames() {
  const box = document.getElementById('nameList');
  box.innerHTML = '';
  names.forEach(n => {
    const lab = document.createElement('label');
    lab.className = 'flex items-center gap-2 px-2.5 py-2 rounded-xl border cursor-pointer ' +
      (n.in ? 'border-slate-700/70 bg-slate-800/60' : 'border-slate-800/50 bg-slate-950/60 text-slate-500');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = n.in; cb.className = 'chk';
    cb.onchange = () => { n.in = cb.checked; renderNames(); drawWheel(); syncTargetSel(); };
    const sp = document.createElement('span');
    sp.textContent = n.name;
    lab.appendChild(cb); lab.appendChild(sp);
    box.appendChild(lab);
  });
  document.getElementById('countIn').textContent = activeNames().length;
  document.getElementById('btnSpin').disabled = activeNames().length < 2 || spinning;
}

function syncTargetSel() {
  const sel = document.getElementById('targetSel');
  const prev = sel.value;
  sel.innerHTML = '';
  activeNames().forEach(n => {
    const o = document.createElement('option');
    o.value = n.id; o.textContent = n.name;
    sel.appendChild(o);
  });
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

async function loadNames() {
  try {
    const r = await fetch('/api/summary');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    names = (d.members || []).map(m => ({ id: m.id, name: m.name, in: m.is_active === 1 }));
    if (!names.length) throw new Error('daftar anggota kosong');
  } catch (e) {
    showErr('Gagal memuat daftar anggota: ' + e.message + ' — roda memakai daftar cadangan.');
    names = ['HEDY','ADRIL','ILHAM','SANDI','SANIA','HERMAN','RAKA','BAYU','SUGENG','SUTISNA','RIDWAN SOLO','INDRA','RIDWAN PKD']
      .map((n, i) => ({ id: 'fb-' + i, name: n, in: true }));
  }
  renderNames(); drawWheel(); syncTargetSel();
}

// ---------- Stealth trigger: triple-click the 🎡 icon (works for touch too) ----------
let trigTaps = [];
document.getElementById('stealthTrig').addEventListener('click', () => {
  const now = Date.now();
  trigTaps = trigTaps.filter(t => now - t < 1200);
  trigTaps.push(now);
  if (trigTaps.length >= 3) {
    trigTaps = [];
    openStealth();
  }
});

function openStealth() {
  syncTargetSel();
  const isTarget = rigTargetId !== null;
  document.getElementById(isTarget ? 'rigTarget' : 'rigFair').checked = true;
  if (isTarget) document.getElementById('targetSel').value = rigTargetId;
  document.getElementById('stealthTarget').classList.toggle('hidden', !isTarget);
  document.getElementById('adminPw').value = '';
  document.getElementById('unlockErr').classList.add('hidden');
  const m = document.getElementById('stealthModal');
  m.classList.remove('hidden'); m.classList.add('open');
}
function closeStealth() {
  const m = document.getElementById('stealthModal');
  m.classList.add('hidden'); m.classList.remove('open');
}

document.querySelectorAll('input[name="rigmode"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('stealthTarget').classList.toggle('hidden',
      document.querySelector('input[name="rigmode"]:checked').value !== 'target');
  });
});

async function applyRig() {
  const want = document.querySelector('input[name="rigmode"]:checked').value;
  const ue = document.getElementById('unlockErr');
  ue.classList.add('hidden');
  if (want === 'fair') {
    rigTargetId = null;
    closeStealth();
    return;
  }
  const tid = document.getElementById('targetSel').value;
  if (!tid) { ue.textContent = 'Pilih nama dulu.'; ue.classList.remove('hidden'); return; }
  // verify admin password before arming a locked winner
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('adminPw').value }),
    });
    if (!r.ok) throw new Error((await r.json()).error || 'Password salah');
  } catch (e) { ue.textContent = e.message; ue.classList.remove('hidden'); return; }
  document.getElementById('adminPw').value = '';
  rigTargetId = tid;
  closeStealth();
}

// ---------- Events ----------
document.getElementById('btnSpin').onclick = doSpin;
document.getElementById('btnApplyRig').onclick = applyRig;
document.getElementById('btnCloseStealth').onclick = closeStealth;
document.getElementById('adminPw').addEventListener('keydown', e => { if (e.key === 'Enter') applyRig(); });
document.getElementById('btnResetNames').onclick = () => {
  names = names.filter(n => !String(n.id).startsWith('x-'));
  names.forEach(n => { n.in = true; });
  renderNames(); drawWheel(); syncTargetSel();
};
document.getElementById('fAdd').onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById('addName');
  const v = inp.value.trim().toUpperCase();
  if (!v) return;
  names.push({ id: 'x-' + Date.now(), name: v, in: true });
  inp.value = '';
  renderNames(); drawWheel(); syncTargetSel();
};
document.getElementById('btnScratch').onclick = () => {
  if (lastWinner) {
    const n = names.find(x => String(x.id) === String(lastWinner.id));
    if (n) n.in = false;
    renderNames(); drawWheel(); syncTargetSel();
  }
  document.getElementById('winModal').classList.add('hidden');
  document.getElementById('winModal').classList.remove('open');
};
document.getElementById('btnCopyWin').onclick = async e => {
  const ok = await copyText(buildWinText());
  if (ok) {
    const b = e.currentTarget, orig = b.textContent;
    b.textContent = '✓ Tersalin ke Clipboard!';
    setTimeout(() => { b.textContent = orig; }, 1800);
  }
};
document.getElementById('btnCloseWin').onclick = () => {
  document.getElementById('winModal').classList.add('hidden');
  document.getElementById('winModal').classList.remove('open');
};

loadNames();

// PWA: register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
</script>
</body>
</html>
