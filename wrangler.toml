# KAS REGU 3 — Cloudflare Pages + D1 + Pages Functions
name = "kas-regu-3"
compatibility_date = "2026-09-01"

# Build output for Cloudflare Pages (GitHub integration):
#   Build command  : (none / empty — static files, no build step)
#   Output dir     : public
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "kas_regu_3"
# TODO: replace with real ID from `wrangler d1 create kas_regu_3`
database_id = "2fe5f0bd-7a71-4f24-9998-cb6cc7c749db"

# Admin password/token is a secret — do NOT put it here.
# Set via dashboard or CLI:
#   wrangler pages secret put ADMIN_KEY --project-name=kas-regu-3
